[package]
name = "markuli"
version = "0.1.0"
edition = "2021"
description = "On-screen annotator with Excalidraw-style ink"
license = "MIT"
publish = false

[workspace]
members = ["crates/core"]
default-members = [".", "crates/core"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[dependencies]
markuli-core = { path = "crates/core" }
# Window, event loop, raw handles for the native presenters. 0.31 is still beta.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
# Pixel buffer type shared with the core (PixmapMut).
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# Global hotkey without Accessibility permission (Carbon / RegisterHotKey).
global-hotkey = { version = "0.8", default-features = false }
# Tray icon and its Quit menu.
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSApplication", "NSButton", "NSControl", "NSTextField", "NSColor", "NSCell", "NSText"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray", "NSString", "NSObject"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "markuli-core"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[features]
# The layout locator (`button_center`) for tests that click the Toolbar. Enabled only through the dev-dependency below, so
# release builds do not contain them (standards rule 2).
test-support = []

[dependencies]
# sin/cos/atan2/sqrt for the laser-pointer port. std uses the platform libm,
# which differs from V8's fdlibm by an ulp and changes the corner-arc loop
# count (fixture `zigzag_corners`), breaking parity. No dependencies.
libm = { version = "0.2", default-features = false }
# Rasterizer only; pure Rust, no OS dependencies.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
# Independent JSON parser to check the hand-written clipboard JSON; tests only,
# never linked into the app (the app itself uses no serde).
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
# PNG read/write for the golden-image tests only; never linked into the app.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
# Turns on `test-support` for this crate's own integration tests.
markuli-core = { path = ".", features = ["test-support"] }
